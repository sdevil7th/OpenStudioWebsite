[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/stem-separation"
  to = "/ai"
  status = 301

# Serve prerendered route documents without Netlify's directory-slash redirect.
# These must stay above the 404 catch-all, and the download function rewrites
# above must retain priority over the canonical /download page.
