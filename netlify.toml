[build]
  command = "npx playwright install --with-deps chromium && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.2"

# Every deployment, including previews, needs the published release contracts.
# Never erase update feeds on a website-only push.
  OPENSTUDIO_FETCH_RELEASE_METADATA = "true"
  OPENSTUDIO_REQUIRE_RELEASE_METADATA = "true"

[[headers]]
  for = "/github/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/openstudio/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Download redirects are generated from validated manifests in dist/_redirects.
# Dynamic compatibility routes and their rate limit are in download-resolver.ts.

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/stem-separation"
  to = "/ai"
  status = 301


# Canonical page rewrites are generated in dist/_redirects from the route inventory.

[[redirects]]
  from = "/v2"
  to = "/"
  status = 301

[[redirects]]
  from = "/v2/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/blogs"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blogs/*"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/github"
  to = "/community"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/community#contact"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
