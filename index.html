    <style id="openstudio-instant-loader-style">
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow-x: clip;
        background: #04050a;
        color: #f8fbff;
      }

      html[data-openstudio-immediate-content] .openstudio-loader {
        display: none;
      }

      .openstudio-loader {
        --os-loader-backdrop-exit-duration: 220ms;
        --os-loader-panel-exit-duration: 200ms;
        --os-loader-content-opacity-exit-duration: 280ms;
        --os-loader-content-filter-exit-duration: 360ms;
        --os-loader-progress-exit-duration: 240ms;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        background: transparent;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        pointer-events: auto;
      }

      .openstudio-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #fcfcff;
        transition: opacity var(--os-loader-backdrop-exit-duration) ease;
      }

      .os-instant-loader__panel {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        background: #fcfcff;
        transition: opacity var(--os-loader-panel-exit-duration) ease;
      }

      .os-instant-loader__panel::before,
      .os-instant-loader__panel::after {
        content: "";
        position: absolute;
        inset: -45%;
        will-change: transform;
        animation: os_loader_mint 9s ease-in-out infinite alternate;
        background: radial-gradient(ellipse at 30% 65%, rgba(0, 234, 210, 0.32), transparent 48%);
      }

      .os-instant-loader__panel::after {
        background: radial-gradient(ellipse at 72% 30%, rgba(241, 63, 154, 0.24), transparent 46%);
        animation-name: os_loader_pink;
        animation-duration: 11s;
      }

      .os-instant-loader__content {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: block;
        text-align: center;
        pointer-events: none;
        transition:
          opacity var(--os-loader-content-opacity-exit-duration) ease,
          filter var(--os-loader-content-filter-exit-duration) ease;
      }

      .os-instant-loader__mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(80svh, 90vw);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 5px 4px rgba(35, 43, 105, 0.18));
      }

      .os-instant-loader__svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: os_loader_rotate 3s linear 800ms infinite;
      }

      @keyframes os_loader_rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes os_loader_mint {
        from { transform: translate(-8%, 5%) rotate(-12deg) scale(1); }
        to { transform: translate(12%, -10%) rotate(28deg) scale(1.12); }
      }

      @keyframes os_loader_pink {
        from { transform: translate(8%, -6%) rotate(10deg) scale(1.12); }
        to { transform: translate(-12%, 12%) rotate(-24deg) scale(0.94); }
      }

      .os-instant-loader__wordmark {
        position: absolute;
        bottom: max(3.5rem, calc(env(safe-area-inset-bottom) + 2rem));
        left: 50%;
        display: grid;
        gap: 0.4rem;
        width: min(42rem, 84vw);
        transform: translate3d(-50%, 0, 0);
      }

      .os-instant-loader__wordmark strong {
        font-size: clamp(1.5rem, 3vw, 2.25rem);
        font-weight: 800;
        line-height: 0.96;
        letter-spacing: 0;
        color: #3445dc;
      }

      .os-instant-loader__wordmark span {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: clamp(0.58rem, 0.82vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #737993;
      }

      .os-instant-loader__progress {
        position: absolute;
        bottom: max(2rem, env(safe-area-inset-bottom));
        left: calc(50% - 4rem);
        width: 8rem;
        border-radius: 2px;
        z-index: 4;
        height: 3px;
        overflow: hidden;
        transform: translateY(-50%);
        background: rgba(52, 69, 220, 0.1);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.035),
          0 0 34px rgba(12, 250, 247, 0.18);
        transition:
          opacity var(--os-loader-progress-exit-duration) ease,
          transform var(--os-loader-progress-exit-duration) ease;
      }

      .os-instant-loader__progress span {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(0.08);
        transform-origin: left center;
        background: linear-gradient(90deg, #3445dc, #00cbbb);
        box-shadow: 0 0 22px rgba(12, 250, 247, 0.3);
        animation: os_loader_progress 8200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .openstudio-loader[data-openstudio-loader-state="leaving"] .os-instant-loader__panel--top {
        opacity: 0;
      }

      .openstudio-loader[data-openstudio-loader-state="leaving"]::before {
        opacity: 0;
      }

      .openstudio-loader[data-openstudio-loader-state="leaving"] {
        pointer-events: none;
      }

      .openstudio-loader[data-openstudio-loader-state="leaving"] .os-instant-loader__content {
        opacity: 0;
        filter: blur(10px);
      }

      .openstudio-loader[data-openstudio-loader-state="leaving"] .os-instant-loader__progress {
        opacity: 0;
        transform: translateY(-50%) scaleY(0);
      }

      .openstudio-loader[data-openstudio-loader-state="leaving"] .os-instant-loader__progress span {
        animation: none;
        transform: scaleX(1);
      }

      @keyframes os_loader_progress {
        0% {
          transform: scaleX(0.08);
        }

        58% {
          transform: scaleX(0.72);
        }

        100% {
          transform: scaleX(0.94);
        }
      }

      @media (max-width: 767px) {
        .openstudio-loader {
          --os-loader-backdrop-exit-duration: 200ms;
          --os-loader-panel-exit-duration: 200ms;
          --os-loader-content-opacity-exit-duration: 140ms;
          --os-loader-content-filter-exit-duration: 180ms;
          --os-loader-progress-exit-duration: 140ms;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .os-instant-loader__svg,
        .os-instant-loader__panel::before,
        .os-instant-loader__panel::after,
        .os-instant-loader__progress span {
          animation: none;
        }

        .os-instant-loader__progress span {
          transform: scaleX(0.72);
        }

        .os-instant-loader__panel,
        .os-instant-loader__content,
        .os-instant-loader__progress {
          transition-duration: 120ms;
        }
      }

    <script>
      (() => {
        const loader = document.getElementById("openstudio-instant-loader");
        if (document.documentElement.hasAttribute("data-openstudio-immediate-content")) {
          loader?.remove();
          window.__openstudioLoaderReady = true;
          window.__openstudioIntroHidden = true;
          return;
        }
        if (!loader) return;

        // Preserve one source of markup for initial and client-side route loading.
        const loaderTemplate = document.createElement("template");
        loaderTemplate.id = "openstudio-loader-template";
        const reusableLoader = loader.cloneNode(true);
        reusableLoader.removeAttribute("id");
        loaderTemplate.content.appendChild(reusableLoader);
        document.body.appendChild(loaderTemplate);

        const markPerformance = (name) => {
          try {
            performance.mark(`openstudio:${name}`);
          } catch {
            /* diagnostics only */
          }
        };

        markPerformance("loader-visible");

        const startedAt = performance.now();
        const mobileIntro = window.matchMedia("(max-width: 767px)").matches;
        const fallbackMs = 9500;
        const cssFallbackMs = 6500;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const mobileRevealMs = 220;
        const desktopRevealMs = 250;
        const revealMs = reduceMotion
          ? mobileIntro
            ? 120
            : 160
          : mobileIntro
            ? mobileRevealMs
            : desktopRevealMs;
        // Let the two pieces meet before revealing a fast-loading route.
        const entranceMs = reduceMotion ? 0 : 800;
        let routeReady = Boolean(window.__openstudioAppReady);
        let cssReady = false;
        let hidden = false;

        window.__openstudioLoaderReady = true;
        window.__openstudioAppCssReady = false;

        const appCssLinks = () => Array.from(document.querySelectorAll("link[data-openstudio-app-css]"));
        const setCssReady = () => {
          if (cssReady) return;
          cssReady = true;
          window.__openstudioAppCssReady = true;
          markPerformance("css-ready");
          finishWhenReady();
        };
        const markCssIfReady = () => {
          const links = appCssLinks();
          if (
            links.length === 0 ||
            links.every((link) => link.dataset.openstudioAppCssReady === "true" || link.rel === "stylesheet")
          ) {
            setCssReady();
          }
        };

        window.__openstudioMarkAppCssReady = markCssIfReady;
        appCssLinks().forEach((link) => {
          link.addEventListener("load", markCssIfReady, { once: true });
          link.addEventListener("error", setCssReady, { once: true });
        });
        requestAnimationFrame(markCssIfReady);
        window.setTimeout(setCssReady, cssFallbackMs);

        function reveal() {
          if (hidden) return;

          hidden = true;

          loader.dataset.openstudioLoaderState = "leaving";
          window.setTimeout(() => {
            loader.remove();
            window.__openstudioIntroHidden = true;
            markPerformance("intro-hidden");
            window.dispatchEvent(new CustomEvent("openstudio:intro-hidden"));
          }, revealMs);
        }

        function finishWhenReady() {
          if (hidden || !routeReady || !cssReady) return;

          const elapsed = performance.now() - startedAt;
          if (elapsed < entranceMs) {
            window.setTimeout(finishWhenReady, entranceMs - elapsed);
            return;
          }

          reveal();
        }

        window.addEventListener(
          "openstudio:app-ready",
          () => {
            routeReady = true;
            finishWhenReady();
          },
          { once: true },
        );
        window.addEventListener(
          "openstudio:static-route-restored",
          () => {
            routeReady = true;
            finishWhenReady();
          },
          { once: true },
        );

        window.setTimeout(() => {
          if (!window.__openstudioAppReady) {
            window.__openstudioRestoreStaticRoute?.();
          }
          routeReady = true;
          finishWhenReady();
        }, fallbackMs);
      })();

    <script>
      (() => {
        const root = document.getElementById("root");
        const staticContent = root?.querySelector(":scope > [data-static-route-content]");
        if (!root || !staticContent) return;

        const fallback = document.createElement("div");
        fallback.id = "openstudio-static-route-fallback";
        const immediateContent = document.documentElement.hasAttribute("data-openstudio-immediate-content");
        fallback.hidden = !immediateContent;
        // Keep the complete legal document readable while React and its lazy
        // route load, including requests which stall without raising an error.
        root.hidden = true;
        fallback.append(staticContent);
        root.after(fallback);

        const cleanup = () => {
          window.removeEventListener("error", restoreOnError, true);
          window.removeEventListener("unhandledrejection", restoreOnRejection);
          window.__openstudioRestoreStaticRoute = undefined;
        };
        const restore = () => {
          if (window.__openstudioAppReady || !fallback.isConnected) return;

          document.documentElement.classList.remove("js");
          root.hidden = true;
          fallback.hidden = false;
          window.__openstudioStaticRouteRestored = true;
          window.dispatchEvent(new CustomEvent("openstudio:static-route-restored"));
        };
        function restoreOnError(event) {
          const target = event.target;
          if (
            event instanceof ErrorEvent ||
            (target instanceof HTMLScriptElement && target.type === "module")
          ) {
            restore();
          }
        }
        function restoreOnRejection() {
          restore();
        }

        window.__openstudioRestoreStaticRoute = restore;
        window.addEventListener("error", restoreOnError, true);
        window.addEventListener("unhandledrejection", restoreOnRejection);
        window.addEventListener(
          "openstudio:app-ready",
          () => {
            root.hidden = false;
            document.documentElement.classList.add("js");
            fallback.remove();
            cleanup();
          },
          { once: true },
        );
      })();
